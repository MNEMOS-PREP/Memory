# =============================================================================
#  THE CONCEPT ONTOLOGY  —  spec §6.1
#
#  120 concepts for Phase 1: DSA + CS core + communication (open decision 1).
#  450 is the year-end target, and growth is an append to this file, not a
#  migration. `system_design`, `aptitude` and `tooling` are declared domains
#  with no concepts yet, deliberately: at 180 concepts the granularity check
#  in §6.1 fails by construction, because M05 cannot seed 3+ calibrated items
#  per concept that fast, and a thin correct ontology beats a large wrong one.
#
#  2026-10-07, the user's decision: `ml` gets its concepts now (36, at the
#  end of this file). Asking for a machine-learning interview gave DSA,
#  because there was nothing in ML to ask about. Open decision 1 is now
#  120 + 36; the granularity check stays thin until M05's bank catches up.
#
#  HOW THIS WAS BUILT, and how to extend it (Trap 5):
#    1. University syllabi for DSA, OS, DBMS, CN, OOP — our own institution's.
#    2. Company topic tags from public LeetCode/GfG company lists (topic names
#       only, never content).
#    3. Communication constructs from the M12/M17 feature list.
#  It was NOT produced by asking a model for 120 concepts. That returns a
#  plausible list with wrong prerequisites and inconsistent granularity, and
#  every downstream number inherits the mess.
#
#  REVIEW STATUS: `reviewed: false`. AC-4.9 gates Phase-1 exit on a faculty
#  member walking the prerequisite edges once, edge by edge, in the ontology
#  browser (§6.10). Until that flag flips this file is a defensible draft, and
#  `GET /v1/concepts` says so rather than implying an authority it does not
#  have.
#
#  SIZING RULE (§3.2.1): a concept is right-sized if a 60-minute session can
#  meaningfully test 4–8 of them, and if a student would recognise the name.
#  "DSA" is too coarse to act on; "Kadane's algorithm" never accumulates
#  enough observations to estimate anything from.
#
#  EDGE DIRECTION, because getting it backwards silently inverts the whole
#  bottleneck query:
#    prerequisites: [{id: X}]   under concept C  =>  edge  X --prerequisite_of--> C
#                                                    "X must come before C"
#    specialises:   [X]         under concept C  =>  edge  X --specialises--> C
#                                                    "X is a narrower case of C"
#
#  Every `prerequisite_of` edge must keep the graph acyclic; `ontology_lint`
#  fails CI otherwise. Aliases are normalised (casefold, strip accents, drop
#  punctuation, collapse whitespace) and must not collide across concepts —
#  also linted, because a collision silently sends a student's topic to the
#  wrong belief.
# =============================================================================

