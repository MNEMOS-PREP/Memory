  # =============================================================================
  #  2026-11-12 — THE GOAL GRAPH (M22, Follow Your Goal)
  #
  #  Everything below was added so that a career goal has something to stand
  #  on. A role on the placement portal asks for React, Spring Boot, Docker,
  #  system design, SQL on a warehouse, a security mindset — and until today
  #  none of those was a concept, so no question could be filed under them, no
  #  resume line could map to them and no mastery could be held for them.
  #
  #  WHERE THE LIST CAME FROM (Trap 5 still holds — not "ask a model for 150"):
  #    1. The "Skills Required" lists of the 80 Haveloc postings in the DATA
  #       repo (2027 batch), counted: what the companies that visit actually ask.
  #    2. M02's 24 role archetypes and their requirement labels.
  #    3. The follow_goal_module brief's own worked example (Full Stack).
  #
  #  THREE DOMAINS THAT WERE DECLARED AND EMPTY NOW HAVE CONCEPTS:
  #    system_design   how systems are put together: APIs, scale, data systems,
  #                    delivery, and frontend architecture
  #    tooling         NAMED technologies: languages, frameworks, databases,
  #                    platforms. A stack choice is a choice between these.
  #    aptitude        reasoning a placement test or a case round asks for
  #  and `behavioural` holds what an HR round looks for. `cs_core` gains the
  #  web platform, security, engineering practice and embedded fundamentals;
  #  `ml` gains statistics, applied AI and ML engineering.
  #
  #  THE SPLIT THAT MAKES A STACK CHANGE CHEAP: a framework-independent idea
  #  (API design, authentication, state management) is one concept; a named
  #  technology (Spring Boot, FastAPI, React, Angular) is another, with the
  #  idea as its prerequisite. Swapping Spring Boot for FastAPI then keeps
  #  everything the student has shown about APIs and auth, by construction.
  #
  #  THREE NEW OPTIONAL KEYS (read by M04's loader; older readers ignore them):
  #    facets        what a question on this concept may be about. The unit of
  #                  question COVERAGE; the concept stays the unit of mastery.
  #    list_aliases  single ordinary words ("react", "go", "express", "excel")
  #                  that name the concept only in an enumeration. Resolved by
  #                  `/v1/concepts/resolve`, never served in `aliases`, so no
  #                  consumer scans prose for them — "react quickly" in a job
  #                  description is not a React requirement.
  #    related       concepts that travel together without one coming first
  #                  (`co_occurs_with`). Not walked by propagation.
  # =============================================================================

